<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Voice Test</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#0e1826; color:#e7eff4; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; text-align:center; padding:20px; }
    .card { max-width:520px; }
    h1 { font-size:22px; margin-bottom:8px; }
    #result { font-size:26px; font-weight:800; margin:24px 0; padding:20px; border-radius:14px; }
    .ok { background:#0d3b2a; color:#4ade80; }
    .bad { background:#3b1620; color:#f87171; }
    .wait { background:#1e2a3a; color:#9db0bd; }
    code { background:#182233; padding:2px 6px; border-radius:5px; font-size:14px; }
    .err { font-size:13px; color:#9db0bd; margin-top:10px; word-break:break-word; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Local Voice connection test</h1>
    <p>This checks whether this HTTPS page can reach a voice engine running on this same computer.</p>
    <div id="result" class="wait">Testing…</div>
    <div class="err" id="err"></div>
    <p style="font-size:13px;color:#9db0bd;">Origin: <code id="org"></code></p>
  </div>
  <script>
    document.getElementById('org').textContent = location.origin;
    (async () => {
      const R = document.getElementById('result'), E = document.getElementById('err');
      try {
        const r = await fetch('http://127.0.0.1:8799/health', { method: 'GET' });
        const t = await r.text();
        R.className = 'ok';
        R.textContent = '✅ WORKS — reached localhost (' + t + ')';
      } catch (e) {
        R.className = 'bad';
        R.textContent = '❌ BLOCKED';
        E.textContent = String(e);
      }
    })();
  </script>
</body>
</html>
